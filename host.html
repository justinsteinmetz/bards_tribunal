<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bard's Tribunal — Host</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
  :root {
    --ink: #0d0b08;
    --parchment: #f5ead6;
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,.35);
    --blood: #7a1515;
    --green: #4a8c4a;
    --green-bright: #8fd98f;
    --red-bright: #c06060;
    --surface: rgba(245,234,214,.04);
    --border: rgba(201,168,76,.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--ink); color:var(--parchment);
    font-family:'Cormorant Garamond', serif;
    min-height:100vh; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse at 15% 40%, rgba(139,26,26,.08) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 60%, rgba(201,168,76,.05) 0%, transparent 55%);
  }
  .screen { display:none; position:relative; z-index:1; min-height:100vh; padding:2rem; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; }
  .screen.active { display:flex; }

  /* TYPE */
  .fraktur { font-family:'UnifrakturMaguntia', cursive; }
  .ornament { color:var(--gold); opacity:.4; font-size:1.2rem; letter-spacing:.9rem; text-align:center; }

  /* BUTTONS */
  .btn {
    font-family:'IM Fell English', serif; font-size:1.1rem;
    padding:.75rem 2.2rem; border:1.5px solid var(--gold);
    background:transparent; color:var(--gold); cursor:pointer;
    letter-spacing:.08em; transition:all .22s; position:relative; overflow:hidden;
  }
  .btn::before { content:''; position:absolute; inset:0; background:var(--gold); transform:scaleX(0); transform-origin:left; transition:transform .22s; z-index:-1; }
  .btn:hover { color:var(--ink); }
  .btn:hover::before { transform:scaleX(1); }
  .btn:disabled { opacity:.3; cursor:not-allowed; }
  .btn:disabled:hover { color:var(--gold); }
  .btn:disabled::before { transform:scaleX(0) !important; }
  .btn-ghost { border-color:rgba(245,234,214,.2); color:rgba(245,234,214,.4); font-size:.9rem; padding:.5rem 1.4rem; }
  .btn-ghost::before { background:rgba(245,234,214,.08); }
  .btn-ghost:hover { color:var(--parchment); }
  .btn-sm { font-size:.88rem; padding:.45rem 1.2rem; }
  .btn-danger { border-color:var(--blood); color:var(--red-bright); }
  .btn-danger::before { background:var(--blood); }
  .btn-danger:hover { color:var(--parchment); }

  /* LOBBY */
  #lobby-screen { text-align:center; max-width:700px; width:100%; }
  h1.main-title {
    font-family:'UnifrakturMaguntia', cursive;
    font-size:clamp(2.8rem,9vw,5.5rem); color:var(--gold);
    text-shadow:0 0 80px rgba(201,168,76,.4), 2px 3px 0 #1a1000;
    line-height:1; animation:candleFlicker 12s infinite;
  }
  @keyframes candleFlicker { 0%,89%,94%,100%{opacity:1} 90%{opacity:.8} 92%{opacity:.95} 93%{opacity:.82} }
  .host-badge { font-family:'IM Fell English', serif; font-style:italic; font-size:.85rem; color:var(--gold); opacity:.5; letter-spacing:.15em; text-transform:uppercase; }

  .api-row { display:flex; gap:.7rem; width:100%; max-width:520px; }
  .api-row input {
    flex:1; background:var(--surface); border:1px solid var(--border);
    color:var(--parchment); font-family:'Cormorant Garamond', serif;
    font-size:1rem; padding:.6rem 1rem; outline:none; transition:border-color .2s;
  }
  .api-row input:focus { border-color:var(--gold); }
  .api-row input::placeholder { opacity:.3; }

  .room-display {
    font-family:'UnifrakturMaguntia', cursive; font-size:5rem; color:var(--gold);
    letter-spacing:.2em; text-shadow:0 0 40px rgba(201,168,76,.3);
    animation:candleFlicker 8s infinite;
  }
  .room-hint { font-family:'IM Fell English', serif; font-style:italic; font-size:.9rem; opacity:.45; }

  /* WAITING ROOM */
  .waiting-grid { display:flex; flex-wrap:wrap; gap:.7rem; justify-content:center; max-width:700px; width:100%; }
  .waiting-chip {
    border:1px solid var(--border); padding:.6rem 1.1rem;
    background:var(--surface); display:flex; align-items:center; gap:.7rem;
    animation:chipIn .3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes chipIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .waiting-chip .chip-name-w { font-family:'IM Fell English', serif; font-size:1rem; }
  .waiting-chip .chip-remove { font-size:.75rem; opacity:.3; cursor:pointer; border:none; background:none; color:var(--red-bright); transition:opacity .2s; }
  .waiting-chip .chip-remove:hover { opacity:1; }
  .waiting-count { font-family:'IM Fell English', serif; font-style:italic; font-size:.9rem; opacity:.4; }
  .conn-status { font-family:'IM Fell English', serif; font-style:italic; font-size:.85rem; opacity:.5; }
  .conn-status.ok { color:var(--green-bright); opacity:.7; }
  .conn-status.err { color:var(--red-bright); opacity:.9; }

  /* GAME SCREEN */
  #game-screen { max-width:960px; width:100%; gap:.85rem; justify-content:flex-start; padding-top:1.5rem; }

  /* SCOREBOARD */
  .scoreboard-strip { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; width:100%; }
  .player-chip {
    display:flex; flex-direction:column; align-items:center;
    border:1px solid var(--border); padding:.4rem .9rem;
    background:var(--surface); min-width:85px; transition:all .3s; position:relative;
  }
  .player-chip.leader { border-color:var(--gold); background:rgba(201,168,76,.1); box-shadow:0 0 20px rgba(201,168,76,.12); }
  .player-chip.buzzed  { border-color:#fff; background:rgba(255,255,255,.12); animation:buzzFlash .4s; }
  .player-chip.scored  { animation:scoreFlash .5s ease-out; }
  .player-chip.wrong   { animation:wrongFlash .4s ease-out; }
  .player-chip.lockedout { opacity:.3; }
  @keyframes buzzFlash  { 0%{background:rgba(255,255,255,.3);transform:scale(1.12)} 100%{} }
  @keyframes scoreFlash { 0%{background:rgba(201,168,76,.45);transform:scale(1.1)} 100%{background:var(--surface);transform:scale(1)} }
  @keyframes wrongFlash { 0%{background:rgba(122,21,21,.5);transform:scale(1.05)} 100%{background:var(--surface);transform:scale(1)} }
  .chip-name { font-family:'IM Fell English', serif; font-size:.82rem; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px; }
  .chip-score { font-family:'UnifrakturMaguntia', cursive; font-size:2rem; color:var(--gold); line-height:1; }
  .chip-rank { font-size:.6rem; opacity:.35; font-style:italic; }

  /* ROUND HEADER */
  .round-header { text-align:center; }
  .round-label { font-family:'IM Fell English', serif; font-size:.82rem; letter-spacing:.15em; text-transform:uppercase; opacity:.4; }
  .round-name-h { font-family:'UnifrakturMaguntia', cursive; font-size:2rem; color:var(--gold); line-height:1.1; }
  .q-counter { font-family:'IM Fell English', serif; font-style:italic; font-size:.88rem; opacity:.45; }

  /* TIMER */
  .timer-row { display:flex; align-items:center; width:100%; gap:1rem; }
  .timer-bar-wrap { flex:1; height:3px; background:rgba(201,168,76,.12); }
  .timer-bar-fill { height:100%; background:var(--gold); transition:width 1s linear, background .3s; }
  .timer-bar-fill.urgent { background:var(--blood); }
  .timer-display { font-family:'UnifrakturMaguntia', cursive; font-size:2rem; color:var(--gold); min-width:38px; text-align:right; line-height:1; transition:color .3s; }
  .timer-display.urgent { color:var(--blood); animation:pulse .5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

  /* QUESTION CARD */
  .question-card {
    width:100%; border:1px solid var(--border);
    background:rgba(13,11,8,.85); padding:1.5rem 2rem; position:relative; backdrop-filter:blur(6px);
    animation:cardIn .35s cubic-bezier(.22,1,.36,1);
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .question-card::before, .question-card::after { content:''; position:absolute; width:13px; height:13px; border-color:var(--gold); border-style:solid; opacity:.4; }
  .question-card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .question-card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
  .q-type-badge { font-family:'IM Fell English', serif; font-style:italic; font-size:.76rem; opacity:.45; letter-spacing:.1em; text-transform:uppercase; margin-bottom:.5rem; }
  .q-text { font-size:1.25rem; line-height:1.65; margin-bottom:1.1rem; }
  .q-text em { font-style:italic; color:rgba(245,234,214,.82); }

  /* OPTIONS */
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; }
  .option-btn {
    font-family:'Cormorant Garamond', serif; font-size:1rem;
    padding:.65rem .9rem; border:1px solid rgba(245,234,214,.15);
    background:rgba(245,234,214,.03); color:var(--parchment);
    text-align:left; display:flex; gap:.7rem; align-items:flex-start; line-height:1.4;
  }
  .option-btn.correct        { border-color:#4a8c4a !important; background:rgba(74,140,74,.15) !important; color:var(--green-bright) !important; }
  .option-btn.wrong-reveal   { border-color:var(--blood) !important; background:rgba(122,21,21,.12) !important; color:var(--red-bright) !important; }
  .option-btn.reveal-correct { border-color:rgba(74,140,74,.5) !important; background:rgba(74,140,74,.07) !important; }
  .opt-key { font-family:'UnifrakturMaguntia', cursive; font-size:1.2rem; color:var(--gold); opacity:.5; flex-shrink:0; }

  /* BUZZ STATUS */
  .buzz-status {
    width:100%; text-align:center;
    font-family:'IM Fell English', serif; font-size:1.05rem;
    min-height:2.4rem; display:flex; align-items:center; justify-content:center; gap:.8rem;
  }
  .buzz-status.waiting  { opacity:.4; font-style:italic; }
  .buzz-status.buzzed-in { color:var(--gold); font-size:1.15rem; }
  .buzz-status.wrong-buzz { color:var(--red-bright); }

  /* HOST CONTROLS */
  .host-controls { display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center; width:100%; }

  /* FEEDBACK */
  .feedback-bar {
    width:100%; padding:.8rem 1.3rem;
    font-family:'IM Fell English', serif; font-size:.95rem;
    text-align:center; border:1px solid; display:none;
  }
  .feedback-bar.show { display:block; }
  .feedback-bar.correct-fb { border-color:#4a8c4a; background:rgba(74,140,74,.1); color:var(--green-bright); }
  .feedback-bar.wrong-fb   { border-color:var(--blood); background:rgba(122,21,21,.1); color:var(--red-bright); }
  .explanation { display:block; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:.9rem; opacity:.75; margin-top:.3rem; }

  /* HOST OVERRIDE PANEL */
  .override-panel {
    width:100%; border:1px solid rgba(201,168,76,.12); padding:.9rem 1.2rem;
    background:rgba(13,11,8,.5); display:none; gap:.6rem; flex-wrap:wrap; align-items:center; justify-content:space-between;
  }
  .override-panel.show { display:flex; }
  .override-label { font-family:'IM Fell English', serif; font-style:italic; font-size:.85rem; opacity:.4; }

  /* INTERMISSION */
  #intermission-screen { text-align:center; }
  .inter-title { font-family:'UnifrakturMaguntia', cursive; font-size:2.6rem; color:var(--gold); }
  .inter-scores { display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center; margin:.8rem 0; }
  .inter-chip { border:1px solid var(--border); padding:.9rem 1.4rem; min-width:115px; }
  .inter-chip.top-dog { border-color:var(--gold); background:rgba(201,168,76,.09); }
  .inter-name  { font-family:'IM Fell English', serif; font-size:.95rem; opacity:.75; }
  .inter-score { font-family:'UnifrakturMaguntia', cursive; font-size:2.8rem; color:var(--gold); }
  .inter-rank-change { font-size:.75rem; font-family:'IM Fell English', serif; font-style:italic; margin-top:.15rem; }
  .inter-rank-change.up   { color:var(--green-bright); }
  .inter-rank-change.down { color:var(--red-bright); }
  .inter-rank-change.same { opacity:.4; }

  /* FINAL */
  #final-screen { text-align:center; }
  .winner-crown { font-size:4.5rem; animation:crownBob 2.2s ease-in-out infinite, crownGlow 2.2s ease-in-out infinite; }
  @keyframes crownBob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes crownGlow { 0%,100%{filter:drop-shadow(0 0 8px rgba(201,168,76,.3))} 50%{filter:drop-shadow(0 0 28px rgba(201,168,76,.75))} }
  .winner-label { font-family:'IM Fell English', serif; font-style:italic; font-size:1.05rem; opacity:.55; }
  .winner-name  { font-family:'UnifrakturMaguntia', cursive; font-size:3.8rem; color:var(--gold); }
  .final-board  { display:flex; flex-direction:column; gap:.4rem; max-width:420px; width:100%; margin:.8rem auto; }
  .final-row { display:flex; justify-content:space-between; align-items:center; padding:.55rem 1rem; border-bottom:1px solid rgba(201,168,76,.12); }
  .final-row:first-child { border-top:1px solid rgba(201,168,76,.12); }
  .final-pos    { font-family:'UnifrakturMaguntia', cursive; font-size:1.5rem; color:var(--gold); width:30px; }
  .final-name-s { font-family:'IM Fell English', serif; font-size:1rem; flex:1; text-align:left; padding-left:.5rem; }
  .final-pts    { font-family:'Cormorant Garamond', serif; font-size:1.05rem; opacity:.75; }

  /* CONFETTI */
  .confetti-piece { position:fixed; width:8px; height:8px; border-radius:1px; pointer-events:none; z-index:999; opacity:0; animation:confettiFall linear forwards; }
  @keyframes confettiFall { 0%{opacity:1;transform:translateY(-20px) rotate(0deg)} 100%{opacity:0;transform:translateY(100vh) rotate(720deg)} }

  hr.divider { border:none; border-top:1px solid rgba(201,168,76,.12); width:100%; }

  /* SCORE EDIT MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(13,11,8,.85); z-index:100; display:none; align-items:center; justify-content:center; }
  .modal-overlay.show { display:flex; }
  .modal-box { border:1px solid var(--gold); background:var(--ink); padding:2rem; max-width:380px; width:90%; display:flex; flex-direction:column; gap:1rem; }
  .modal-title { font-family:'UnifrakturMaguntia', cursive; font-size:1.8rem; color:var(--gold); }
  .modal-row { display:flex; gap:.7rem; align-items:center; }
  .modal-row label { font-family:'IM Fell English', serif; font-size:.9rem; opacity:.6; min-width:80px; }
  .modal-row input { flex:1; background:var(--surface); border:1px solid var(--border); color:var(--parchment); font-family:'Cormorant Garamond', serif; font-size:1rem; padding:.4rem .7rem; outline:none; }
  .modal-row input:focus { border-color:var(--gold); }
</style>
</head>
<body>

<!-- ══ LOBBY ══ -->
<div id="lobby-screen" class="screen active">
  <div class="ornament">✦ ✦ ✦</div>
  <h1 class="main-title">The Bard's<br>Tribunal</h1>
  <div class="host-badge">✦ Host Dashboard ✦</div>

  <div class="api-row">
    <input type="text" id="ably-key" placeholder="Ably API key (paste here)" autocomplete="off">
    <button class="btn" onclick="connectAbly()">Connect</button>
  </div>
  <div class="conn-status" id="conn-status">Enter your Ably API key to open the Tribunal.</div>

  <div id="room-section" style="display:none;flex-direction:column;align-items:center;gap:.8rem;width:100%;">
    <div class="room-hint">Room code — players enter this at player.html</div>
    <div class="room-display" id="room-display">—</div>
    <div id="waiting-count-label" class="waiting-count">Awaiting the accused…</div>
    <div class="waiting-grid" id="waiting-grid"></div>
    <button class="btn" id="start-btn" onclick="startGame()" disabled>Begin the Inquisition</button>
    <button class="btn btn-ghost btn-sm" onclick="regenerateRoom()">New Room Code</button>
  </div>
</div>

<!-- ══ GAME ══ -->
<div id="game-screen" class="screen">
  <div class="scoreboard-strip" id="scoreboard"></div>
  <hr class="divider">
  <div class="round-header">
    <div class="round-label">Round <span id="round-num"></span> of 4</div>
    <div class="round-name-h" id="round-name"></div>
    <div class="q-counter" id="q-counter"></div>
  </div>
  <div class="timer-row">
    <div class="timer-bar-wrap"><div class="timer-bar-fill" id="timer-bar"></div></div>
    <div class="timer-display" id="timer-display">20</div>
  </div>
  <div class="question-card" id="question-card">
    <div class="q-type-badge" id="q-type-badge"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options-grid" id="options-grid"></div>
  </div>
  <div class="buzz-status waiting" id="buzz-status">Awaiting a buzz…</div>
  <div class="feedback-bar" id="feedback-bar"></div>

  <!-- HOST CONTROLS -->
  <div class="host-controls" id="host-controls">
    <button class="btn btn-sm" id="reveal-btn" onclick="hostReveal()" style="display:none;">Reveal Answer</button>
    <button class="btn btn-sm btn-danger" id="wrong-btn" onclick="hostMarkWrong()" style="display:none;">✗ Wrong — reopen buzz</button>
    <button class="btn btn-sm" id="correct-btn" onclick="hostMarkCorrect()" style="display:none;">✓ Correct</button>
    <button class="btn btn-sm" id="skip-btn" onclick="hostSkip()" style="display:none;">Skip Question</button>
    <button class="btn btn-sm" id="next-btn" onclick="nextQuestion()" style="display:none;">Next Question →</button>
  </div>

  <div class="override-panel" id="override-panel">
    <span class="override-label">Override score:</span>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
    </div>
  </div>
</div>

<!-- ══ INTERMISSION ══ -->
<div id="intermission-screen" class="screen">
  <div class="ornament">✦ ✦ ✦</div>
  <div class="inter-title" id="inter-title"></div>
  <p style="font-family:'IM Fell English',serif;font-style:italic;opacity:.5;" id="inter-sub"></p>
  <div class="inter-scores" id="inter-scores"></div>
  <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.78rem;opacity:.3;margin-top:-.2rem;">Click any score to edit</p>
  <button class="btn" onclick="continueGame()">Onwards →</button>
</div>

<!-- ══ FINAL ══ -->
<div id="final-screen" class="screen">
  <div class="winner-crown">♛</div>
  <div class="winner-label">Victor of the Tribunal</div>
  <div class="winner-name" id="winner-name"></div>
  <div class="final-board" id="final-board"></div>
  <div class="ornament" style="margin-top:.8rem;">✦ ✦ ✦</div>
  <button class="btn" onclick="location.reload()" style="margin-top:.8rem;">New Tribunal</button>
</div>

<!-- SCORE EDIT MODAL -->
<div class="modal-overlay" id="score-modal">
  <div class="modal-box">
    <div class="modal-title">Edit Score</div>
    <div class="modal-row">
      <label>Player</label>
      <span id="modal-player-name" style="font-family:'IM Fell English',serif;font-size:1rem;"></span>
    </div>
    <div class="modal-row">
      <label>Score</label>
      <input type="number" id="modal-score-input" min="0" max="99">
    </div>
    <div style="display:flex;gap:.7rem;justify-content:flex-end;">
      <button class="btn btn-ghost btn-sm" onclick="closeScoreModal()">Cancel</button>
      <button class="btn btn-sm" onclick="saveScoreEdit()">Save</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  DATA — question bank
// ══════════════════════════════════════════════════════
const ROUNDS = [
  {
    name:"The Vocabulary of Desire", timerSeconds:15,
    questions:[
      { type:"Elizabethan Vocabulary", q:"In Elizabethan English, what does <em>dost</em> mean?",
        correct:"Do / Does", options:["Do / Does","Dust (as in particles)","A type of doublet","A German loanword meaning 'thyme'"],
        explanation:"Dost = 'do' or 'does' — e.g. 'Dost thou protest too much?'" },
      { type:"Elizabethan Vocabulary", q:"Shakespeare uses the word <em>cozen</em>. What does it mean?",
        correct:"To cheat or deceive", options:["To cheat or deceive","A distant cousin","To cosy up to someone","A type of Elizabethan cushion"],
        explanation:"To cozen = to cheat or trick. Nothing to do with cousins, despite the spelling." },
      { type:"Elizabethan Vocabulary", q:"In sonnet language, what is a <em>mistress</em>?",
        correct:"The woman a poet addresses or admires", options:["The woman a poet addresses or admires","A married woman of high rank only","A secret lover, always illicit","The female lead in a theatrical company"],
        explanation:"'Mistress' simply meant a woman one loved or admired — not necessarily scandalous." },
      { type:"Elizabethan Vocabulary", q:"What does <em>anon</em> mean?",
        correct:"Shortly / soon", options:["Shortly / soon","Anonymous","An interjection of surprise","Never, in formal usage"],
        explanation:"Anon = soon, shortly. 'I'll come anon' means 'I'll be there in a moment.'" },
      { type:"Elizabethan Vocabulary", q:"Shakespeare writes of <em>temperate</em> in Sonnet 18. What does it mean here?",
        correct:"Mild, moderate, well-balanced", options:["Mild, moderate, well-balanced","Hot-tempered and passionate","Relating to weather only","A musical tempo marking"],
        explanation:"'Thou art more lovely and more temperate' — temperate means moderate, calm, not subject to extremes." }
    ]
  },
  {
    name:"Line & Licence", timerSeconds:20,
    questions:[
      { type:"Sonnet Identification", q:"Which sonnet begins: <em>'Shall I compare thee to a summer's day?'</em>",
        correct:"Sonnet 18", options:["Sonnet 18","Sonnet 116","Sonnet 130","Sonnet 29"],
        explanation:"Sonnet 18 — the most famous opening line in the sequence." },
      { type:"Literary Device", q:"In <em>'My mistress' eyes are nothing like the sun'</em>, Shakespeare is using:",

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function genCode() {
  return Math.random().toString(36).substring(2,6).toUpperCase();
}
function getRanks() {
  const sorted = [...players].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0));
  const r = {};
  sorted.forEach((p,i)=>{ r[p.id]=i+1; });
  return r;
}
function buildQuestionList() {
  allQuestions=[];
  ROUNDS.forEach((r,ri)=>r.questions.forEach((q,qi)=>allQuestions.push({...q,roundIndex:ri,timerSeconds:r.timerSeconds,qInRound:qi,totalInRound:r.questions.length})));
}

let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,type,dur,vol=.18,delay=0){
  try{const ctx=getAudio(),osc=ctx.createOscillator(),g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.type=type;osc.frequency.setValueAtTime(freq,ctx.currentTime+delay);g.gain.setValueAtTime(0,ctx.currentTime+delay);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+dur);osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+dur);}catch(e){}
}
function soundBuzz()    { playTone(660,'square',.08,.12); }
function soundCorrect() { [523,659,784].forEach((n,i)=>playTone(n,'sine',.25,.15,i*.12)); }
function soundWrong()   { playTone(220,'sawtooth',.08,.1);playTone(180,'sawtooth',.2,.1,.1); }
function soundTick()    { playTone(880,'sine',.06,.06); }
function soundTimeUp()  { playTone(300,'sawtooth',.08,.12);playTone(200,'sawtooth',.3,.12,.1); }
function soundFanfare() { [523,659,784,1047].forEach((n,i)=>playTone(n,'sine',.4,.2,i*.13)); }

function connectAbly() {
  const key = ABLY_KEY_HARDCODED || document.getElementById('ably-key').value.trim();
  if (!key) { setConnStatus('Please enter your Ably API key.', false); return; }
  setConnStatus('Connecting…', null);
  try {
    ably = new Ably.Realtime({ key, clientId: 'host' });
    ably.connection.on('connected', () => {
      setConnStatus('Connected ✓', true);
      openRoom();
    });
    ably.connection.on('failed', () => setConnStatus('Connection failed — check your key.', false));
  } catch(e) { setConnStatus('Error: ' + e.message, false); }
}

// Auto-connect if key is hardcoded
if (ABLY_KEY_HARDCODED) {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('ably-key').style.display = 'none';
    connectAbly();
  });
}

function setConnStatus(msg, ok) {
  const el = document.getElementById('conn-status');
  el.textContent = msg;
  el.className = 'conn-status' + (ok===true?' ok':ok===false?' err':'');
}

function openRoom() {
  roomCode = genCode();
  document.getElementById('room-display').textContent = roomCode;
  document.getElementById('room-section').style.display = 'flex';
  document.getElementById('room-section').style.flexDirection = 'column';
  document.getElementById('room-section').style.alignItems = 'center';
  document.getElementById('room-section').style.gap = '.8rem';

  channel = ably.channels.get('tribunal-' + roomCode);

  channel.subscribe('player:join', (msg) => {
    const { id, name } = msg.data;
    const existing = players.find(p=>p.id===id);
    if (existing) {
      // Rejoin — player already known, re-send current state
      channel.publish('host:roster', { players, scores });
      // If game is running, resync them to current question
      if (questionPhase !== 'idle' && allQuestions.length && globalQIndex < allQuestions.length) {
        const q = allQuestions[globalQIndex];
        channel.publish('host:question', {
          index: globalQIndex,
          roundIndex: currentRound,
          roundName: ROUNDS[currentRound].name,
          qInRound: q.qInRound,
          totalInRound: q.totalInRound,
          type: q.type,
          q: q.q,
          options: shuffledOpts,
          timerSeconds: q.timerSeconds,
          phase: questionPhase
        });
        channel.publish('host:scores', { scores, players });
        // Re-lock them out if they were
        if (lockedOut.includes(id)) {
          channel.publish('host:phase', { phase: 'wrong', buzzedId: id, chosenIndex: -1 });
        }
      }
      return;
    }
    // New player
    if (!players.find(p=>p.id===id)) {
      players.push({ id, name });
      scores[id] = 0;
      renderWaiting();
      channel.publish('host:roster', { players, scores });
    }
  });

  channel.subscribe('player:buzz', (msg) => {
    if (questionPhase !== 'buzzing') return;
    const { id } = msg.data;
    if (lockedOut.includes(id)) return;
    doBuzz(id);
  });

  channel.subscribe('player:answer', (msg) => {
    if (questionPhase !== 'answering') return;
    if (msg.data.id !== buzzedPlayerId) return;
    doAnswer(msg.data.optionIndex);
  });
}

function regenerateRoom() {
  if (channel) channel.unsubscribe();
  players = []; scores = {};
  openRoom();
  renderWaiting();
}

function renderWaiting() {
  const grid = document.getElementById('waiting-grid');
  grid.innerHTML = '';
  players.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'waiting-chip';
    chip.innerHTML = `<span class="chip-name-w">${p.name}</span><button class="chip-remove" onclick="removePlayer('${p.id}')">✕</button>`;
    grid.appendChild(chip);
  });
  const n = players.length;
  document.getElementById('waiting-count-label').textContent =
    n === 0 ? 'Awaiting the accused…' : `${n} player${n>1?'s':''} assembled`;
  document.getElementById('start-btn').disabled = n < 1;
}

function removePlayer(id) {
  players = players.filter(p=>p.id!==id);
  delete scores[id];
  renderWaiting();
  channel.publish('host:roster', { players, scores });
}

function startGame() {
  buildQuestionList();
  globalQIndex = 0; currentRound = 0;
  players.forEach(p => { scores[p.id] = 0; prevRanks[p.id] = 1; });
  showScreen('game-screen');
  renderQuestion();
}

// ══════════════════════════════════════════════════════
//  SCOREBOARD
// ══════════════════════════════════════════════════════
function renderScoreboard(flashId=null, wrongId=null) {
  const sb = document.getElementById('scoreboard');
  const ranks = getRanks();
  const maxScore = Math.max(0, ...players.map(p=>scores[p.id]||0));
  sb.innerHTML = '';
  [...players].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0)).forEach(p => {
    const chip = document.createElement('div');
    let cls = 'player-chip';
    if ((scores[p.id]||0) === maxScore && maxScore > 0) cls += ' leader';
    if (p.id === flashId) cls += ' scored';
    if (p.id === wrongId) cls += ' wrong';
    if (p.id === buzzedPlayerId && questionPhase==='answering') cls += ' buzzed';
    if (lockedOut.includes(p.id)) cls += ' lockedout';
    chip.className = cls; chip.id = 'chip-' + p.id;
    const rank = ranks[p.id] || 1;
    const suf = rank===1?'st':rank===2?'nd':rank===3?'rd':'th';
    chip.innerHTML = `<div class="chip-name" title="${p.name}">${p.name}</div><div class="chip-score" onclick="openScoreModal('${p.id}')" title="Click to edit">${scores[p.id]||0}</div><div class="chip-rank">${rank}${suf}</div>`;
    sb.appendChild(chip);
  });
}

function renderQuestion() {
  if (globalQIndex >= allQuestions.length) { showFinal(); return; }
  const q = allQuestions[globalQIndex];

  if (q.roundIndex !== currentRound) {
    const done = currentRound; currentRound = q.roundIndex;
    showIntermission(done); return;
  }

  questionPhase = 'buzzing';
  buzzedPlayerId = null;
  lockedOut = [];
  shuffledOpts = shuffle(q.options);
  correctIndex = shuffledOpts.indexOf(q.correct);

  // UI
  document.getElementById('round-num').textContent = currentRound + 1;
  document.getElementById('round-name').textContent = ROUNDS[currentRound].name;
  document.getElementById('q-counter').textContent = `Question ${q.qInRound+1} of ${q.totalInRound}`;
  document.getElementById('q-type-badge').textContent = q.type;
  document.getElementById('q-text').innerHTML = q.q;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  shuffledOpts.forEach((opt,i) => {
    const btn = document.createElement('div');
    btn.className = 'option-btn'; btn.id = 'opt-' + i;
    btn.innerHTML = `<span class="opt-key">${i+1}</span><span>${opt}</span>`;
    grid.appendChild(btn);
  });

  const card = document.getElementById('question-card');
  card.style.animation='none'; card.offsetHeight; card.style.animation='';

  setBuzzStatus('waiting', 'Awaiting a buzz…');
  const fb = document.getElementById('feedback-bar');
  fb.className = 'feedback-bar'; fb.innerHTML = '';

  // Host controls
  showBtn('reveal-btn', false); showBtn('wrong-btn', false); showBtn('correct-btn', false);
  showBtn('skip-btn', true); showBtn('next-btn', false);

  renderScoreboard();
  startTimer(q);

  // Broadcast question to players
  channel.publish('host:question', {
    index: globalQIndex,
    roundIndex: currentRound,
    roundName: ROUNDS[currentRound].name,
    qInRound: q.qInRound,
    totalInRound: q.totalInRound,
    type: q.type,
    q: q.q,
    options: shuffledOpts,
    timerSeconds: q.timerSeconds,
    phase: 'buzzing'
  });
  channel.publish('host:scores', { scores, players });
}

function showBtn(id, show) {
  const el = document.getElementById(id);
  if (el) el.style.display = show ? 'inline-block' : 'none';
}

function setBuzzStatus(cls, txt) {
  const bs = document.getElementById('buzz-status');
  bs.className = 'buzz-status ' + cls;
  bs.textContent = txt;

// ══════════════════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════════════════
function startTimer(q) {
  clearInterval(timerInterval);
  totalTime = q.timerSeconds; timeLeft = totalTime;
  const display = document.getElementById('timer-display');
  const bar = document.getElementById('timer-bar');
  display.textContent = timeLeft; display.className = 'timer-display';
  bar.className = 'timer-bar-fill'; bar.style.width = '100%';
  bar.style.transition = `width ${totalTime}s linear`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width='0%';}));
  timerInterval = setInterval(() => {
    timeLeft--;
    display.textContent = timeLeft;
    if (timeLeft <= 5) { display.className='timer-display urgent'; bar.className='timer-bar-fill urgent'; soundTick(); }
    if (timeLeft <= 0) { clearInterval(timerInterval); if(questionPhase!=='done') timeUp(); }
  }, 1000);
}

function pauseTimer() { clearInterval(timerInterval); }

function resumeTimer() {
  const display = document.getElementById('timer-display');
  const bar = document.getElementById('timer-bar');
  bar.style.transition = `width ${timeLeft}s linear`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width='0%';}));
  timerInterval = setInterval(() => {
    timeLeft--;
    display.textContent = timeLeft;
    if (timeLeft <= 5) { display.className='timer-display urgent'; bar.className='timer-bar-fill urgent'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); if(questionPhase!=='done') timeUp(); }
  }, 1000);
}

function timeUp() {
  questionPhase = 'done';
  soundTimeUp();
  revealAnswer(-1, null);
  setBuzzStatus('wrong-buzz', "Time's up — no point awarded.");
  showBtn('next-btn', true); showBtn('skip-btn', false);
  showBtn('reveal-btn', false); showBtn('wrong-btn', false); showBtn('correct-btn', false);
  channel.publish('host:phase', { phase: 'done', correctIndex, buzzedId: null, scored: false });
  renderScoreboard();
}

// ══════════════════════════════════════════════════════
//  BUZZ
// ══════════════════════════════════════════════════════
function doBuzz(id) {
  buzzedPlayerId = id;
  questionPhase = 'answering';
  pauseTimer();
  soundBuzz();
  const p = players.find(x=>x.id===id);
  setBuzzStatus('buzzed-in', `${p?.name || 'Someone'} has buzzed in…`);
  showBtn('wrong-btn', true); showBtn('correct-btn', true);
  showBtn('reveal-btn', false); showBtn('skip-btn', false);
  renderScoreboard();
  channel.publish('host:phase', { phase: 'answering', buzzedId: id, buzzedName: p?.name });
}

// ══════════════════════════════════════════════════════
//  ANSWER PROCESSING
// ══════════════════════════════════════════════════════
function doAnswer(chosenIndex) {
  if (chosenIndex === correctIndex) {
    markCorrect(buzzedPlayerId);
  } else {
    markWrong(buzzedPlayerId, chosenIndex);
  }
}

function markCorrect(id) {
  questionPhase = 'done';
  clearInterval(timerInterval);
  scores[id] = (scores[id]||0) + 1;
  soundCorrect();
  revealAnswer(shuffledOpts.indexOf(allQuestions[globalQIndex].correct), id);
  const p = players.find(x=>x.id===id);
  setBuzzStatus('buzzed-in', `✓ ${p?.name} scores a point!`);
  showBtn('next-btn', true); showBtn('wrong-btn', false); showBtn('correct-btn', false); showBtn('skip-btn', false);
  channel.publish('host:phase', { phase: 'done', correctIndex, buzzedId: id, scored: true });
  channel.publish('host:scores', { scores, players });
  renderScoreboard(id);
}

function markWrong(id, chosenIndex) {
  soundWrong();
  lockedOut.push(id);
  document.getElementById('opt-'+(chosenIndex!==undefined?chosenIndex:''))?.classList.add('wrong-reveal');
  const p = players.find(x=>x.id===id);
  setBuzzStatus('wrong-buzz', `✗ ${p?.name} — wrong. Others may buzz in…`);
  channel.publish('host:phase', { phase: 'wrong', buzzedId: id, chosenIndex });

  if (lockedOut.length >= players.length) {
    questionPhase = 'done';
    clearInterval(timerInterval);
    revealAnswer(-1, null);
    setBuzzStatus('wrong-buzz', 'Nobody got it — Shakespeare weeps.');
    showBtn('next-btn', true); showBtn('wrong-btn', false); showBtn('correct-btn', false); showBtn('skip-btn', false);
    channel.publish('host:phase', { phase: 'done', correctIndex, buzzedId: null, scored: false });
  } else {
    buzzedPlayerId = null;
    questionPhase = 'buzzing';
    showBtn('wrong-btn', false); showBtn('correct-btn', false); showBtn('skip-btn', true);
    renderScoreboard(-1, id);
    resumeTimer();
    channel.publish('host:phase', { phase: 'buzzing', lockedOut });
  }
}

// HOST OVERRIDE CONTROLS
function hostReveal() {
  revealAnswer(correctIndex, null);
  showBtn('reveal-btn', false);
}
function hostMarkWrong() {
  if (!buzzedPlayerId) return;
  const id = buzzedPlayerId;
  markWrong(id, undefined);
}
function hostMarkCorrect() {
  if (!buzzedPlayerId) return;
  markCorrect(buzzedPlayerId);
}
function hostSkip() {
  questionPhase = 'done';
  clearInterval(timerInterval);
  revealAnswer(-1, null);
  setBuzzStatus('wrong-buzz', 'Question skipped.');
  showBtn('next-btn', true); showBtn('skip-btn', false);
  showBtn('wrong-btn', false); showBtn('correct-btn', false);
  // close-answers tells all player clients to hide answer panel immediately
  channel.publish('host:phase', { phase: 'close-answers' });
  channel.publish('host:phase', { phase: 'done', correctIndex, buzzedId: null, scored: false });
}

// ══════════════════════════════════════════════════════
//  REVEAL
// ══════════════════════════════════════════════════════
function revealAnswer(chosenIndex, scorerId) {
  shuffledOpts.forEach((_,i) => {
    const el = document.getElementById('opt-'+i);
    if (!el) return;
    if (i === correctIndex) el.classList.add(scorerId?'correct':'reveal-correct');
    else if (i === chosenIndex) el.classList.add('wrong-reveal');
  });
  const fb = document.getElementById('feedback-bar');
  fb.classList.add('show');
  const q = allQuestions[globalQIndex];
  if (scorerId) {
    fb.classList.add('correct-fb');
    fb.innerHTML = `✓ Correct! <span class="explanation">${q.explanation}</span>`;
  } else {
    fb.classList.add('wrong-fb');
    fb.innerHTML = `✗ <span class="explanation">${q.explanation}</span>`;
  }
}

function nextQuestion() {
  prevRanks = getRanks();
  globalQIndex++;
  channel.publish('host:scores', { scores, players });
  renderQuestion();
}

// ══════════════════════════════════════════════════════
//  INTERMISSION
// ══════════════════════════════════════════════════════
function showIntermission(completedRound) {
  showScreen('intermission-screen');
  const next = ROUNDS[completedRound+1] || null;
  document.getElementById('inter-title').textContent = `End of Round ${completedRound+1}`;
  document.getElementById('inter-sub').textContent = next ? `Next: Round ${completedRound+2} — ${next.name}` : 'The Final Reckoning awaits.';

  const curRanks = getRanks();
  const sorted = players.map(p=>({...p,score:scores[p.id]||0,rank:curRanks[p.id]||1,prevRank:prevRanks[p.id]||1})).sort((a,b)=>b.score-a.score);
  const maxScore = sorted[0]?.score || 0;
  const container = document.getElementById('inter-scores');
  container.innerHTML = '';
  sorted.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'inter-chip' + (p.score===maxScore&&maxScore>0?' top-dog':'');
    let delta='— holding', dc='same';
    if(p.prevRank>p.rank){delta=`↑ up ${p.prevRank-p.rank}`;dc='up';}
    else if(p.prevRank<p.rank){delta=`↓ down ${p.rank-p.prevRank}`;dc='down';}
    chip.style.cursor='pointer';
    chip.title='Click to edit score';
    chip.onclick=()=>openScoreModal(p.id);
    chip.innerHTML=`<div class="inter-name">${p.name}</div><div class="inter-score">${p.score}</div><div class="inter-rank-change ${dc}">${delta}</div>`;
    container.appendChild(chip);
  });
  channel.publish('host:intermission', { round: completedRound, scores, players });
}

function continueGame() {
  prevRanks = getRanks();
  showScreen('game-screen');
  renderQuestion();
}

// ══════════════════════════════════════════════════════
//  FINAL
// ══════════════════════════════════════════════════════
function showFinal() {
  showScreen('final-screen');
  soundFanfare();
  setTimeout(()=>launchConfetti(80), 300);
  const sorted = [...players].map(p=>({...p,score:scores[p.id]||0})).sort((a,b)=>b.score-a.score);
  document.getElementById('winner-name').textContent = sorted[0]?.name || '—';
  const board = document.getElementById('final-board');
  board.innerHTML = '';
  const medals=['♛','♜','♝','♞'];
  sorted.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='final-row';
    row.innerHTML=`<div class="final-pos">${medals[i]||i+1}</div><div class="final-name-s">${p.name}</div><div class="final-pts">${p.score} pt${p.score!==1?'s':''}</div>`;
    board.appendChild(row);
  });
  channel.publish('host:final', { scores, players });
}

// ══════════════════════════════════════════════════════
//  SCORE EDIT MODAL
// ══════════════════════════════════════════════════════
function openScoreModal(id) {
  modalEditId = id;
  const p = players.find(x=>x.id===id);
  document.getElementById('modal-player-name').textContent = p?.name || id;
  document.getElementById('modal-score-input').value = scores[id] || 0;
  document.getElementById('score-modal').classList.add('show');
  setTimeout(()=>document.getElementById('modal-score-input').focus(), 50);
}
function closeScoreModal() {
  document.getElementById('score-modal').classList.remove('show');
  modalEditId = null;
}
function saveScoreEdit() {
  if (!modalEditId) return;
  const val = parseInt(document.getElementById('modal-score-input').value, 10);
  if (!isNaN(val) && val >= 0) {
    // Snapshot prevRanks before the edit so intermission deltas reflect the change
    prevRanks = getRanks();
    scores[modalEditId] = val;
    renderScoreboard();
    channel.publish('host:scores', { scores, players });
  }
  closeScoreModal();
}
document.getElementById('score-modal').addEventListener('click', e => { if(e.target===document.getElementById('score-modal'))closeScoreModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape')closeScoreModal(); });
</script>
